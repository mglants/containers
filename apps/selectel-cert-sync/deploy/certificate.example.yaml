apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cdn-example-com
spec:
  secretName: cdn-example-com-tls
  # cert-manager copies these annotations onto the generated TLS Secret.
  secretTemplate:
    annotations:
      selectel-cert-sync.glants.xyz/enabled: "true"
      selectel-cert-sync.glants.xyz/name: production-cdn-example-com
      # Empty = upload/update only. Add existing CDN resource UUIDs to bind them.
      selectel-cert-sync.glants.xyz/resource-ids: ""
  duration: 2160h # Requested 90 days; the issuer determines actual lifetime.
  renewBeforePercentage: 33
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
    rotationPolicy: Always
  dnsNames:
    - cdn.example.com
  issuerRef:
    name: replace-with-your-dns01-clusterissuer
    kind: ClusterIssuer
